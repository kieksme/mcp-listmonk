name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify tool catalog
        run: pnpm list-tools

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub Packages requires the scope to match the repo owner ("kieksme"),
      # which @kieksme/listmonk-mcp already satisfies. Re-pointing setup-node
      # at this registry only rewrites ~/.npmrc's auth/scope mapping — the
      # already-built dist/ from the steps above is reused, no rebuild needed.
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kieksme"

      - name: Publish to GitHub Packages
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
